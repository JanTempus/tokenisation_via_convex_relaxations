[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-tokeniser"
version = "0.1.0"
description = "Linear-programming tokenizer training and export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cvxpy>=1.4",
  "datasets>=3",
  "numpy>=1.24",
  "scipy>=1.10",
  "tokenizers>=0.20",
  "transformers>=4.48",
]

[project.scripts]
lp-tokeniser = "lp_tokenizer.cli:main"

[tool.setuptools.packages.find]
include = ["lp_tokenizer*"]
